<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    8-Player Table Seating Arrangement (Top-Down View)
  </text>
  
  <!-- BEFORE: 4-Player Layout -->
  <g id="before-layout">
    <!-- Title -->
    <text x="300" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
      BEFORE: 4-Player Table
    </text>
    <text x="300" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
      Radius: 0.75f
    </text>
    
    <!-- Table Center Circle -->
    <circle cx="300" cy="300" r="100" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="300" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Table
    </text>
    <text x="300" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Center
    </text>
    
    <!-- Radius circle (0.75f) -->
    <circle cx="300" cy="300" r="150" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Player 1 at 0° (North) -->
    <line x1="300" y1="300" x2="300" y2="150" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="300" cy="150" r="30" fill="#ff6b6b" stroke="#333" stroke-width="2"/>
    <text x="300" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      P1
    </text>
    <text x="300" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">
      0°
    </text>
    <text x="300" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      North
    </text>
    
    <!-- Player 2 at 180° (South) -->
    <line x1="300" y1="300" x2="300" y2="450" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="300" cy="450" r="30" fill="#4ecdc4" stroke="#333" stroke-width="2"/>
    <text x="300" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      P2
    </text>
    <text x="300" y="465" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#fff">
      180°
    </text>
    <text x="300" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      South
    </text>
    
    <!-- Player 3 at 270° (West) -->
    <line x1="300" y1="300" x2="150" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="150" cy="300" r="30" fill="#ffe66d" stroke="#333" stroke-width="2"/>
    <text x="150" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      P3
    </text>
    <text x="150" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      270°
    </text>
    <text x="100" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      West
    </text>
    
    <!-- Player 4 at 90° (East) -->
    <line x1="300" y1="300" x2="450" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="450" cy="300" r="30" fill="#95e1d3" stroke="#333" stroke-width="2"/>
    <text x="450" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      P4
    </text>
    <text x="450" y="315" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      90°
    </text>
    <text x="500" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
      East
    </text>
  </g>
  
  <!-- AFTER: 8-Player Layout -->
  <g id="after-layout">
    <!-- Title -->
    <text x="900" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">
      AFTER: 8-Player Table
    </text>
    <text x="900" y="90" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">
      Radius: 1.5f (2x scale)
    </text>
    
    <!-- Table Center Circle -->
    <circle cx="900" cy="300" r="100" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="900" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Table
    </text>
    <text x="900" y="310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Center
    </text>
    
    <!-- Old radius circle (0.75f) for reference -->
    <circle cx="900" cy="300" r="150" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="1020" y="310" font-family="Arial, sans-serif" font-size="10" text-anchor="start" fill="#999">
      Old: 0.75f
    </text>
    
    <!-- New radius circle (1.5f) -->
    <circle cx="900" cy="300" r="250" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Player 1 at 0° (North) - MOVED OUT -->
    <line x1="900" y1="300" x2="900" y2="50" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="900" cy="50" r="30" fill="#ff6b6b" stroke="#333" stroke-width="3"/>
    <text x="900" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      P1
    </text>
    <text x="900" y="62" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">
      0°
    </text>
    <text x="900" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ff6b6b">
      MOVED OUT
    </text>
    
    <!-- Player 5 at 45° (NE) - NEW -->
    <line x1="900" y1="300" x2="1076.78" y2="123.22" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="1076.78" cy="123.22" r="30" fill="#c7ceea" stroke="#333" stroke-width="2"/>
    <text x="1076.78" y="121" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P5
    </text>
    <text x="1076.78" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      45°
    </text>
    <text x="1076.78" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b6bff">
      NEW
    </text>
    
    <!-- Player 4 at 90° (East) - MOVED OUT -->
    <line x1="900" y1="300" x2="1150" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="1150" cy="300" r="30" fill="#95e1d3" stroke="#333" stroke-width="3"/>
    <text x="1150" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P4
    </text>
    <text x="1150" y="312" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      90°
    </text>
    <text x="1150" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#95e1d3">
      MOVED OUT
    </text>
    
    <!-- Player 6 at 135° (SE) - NEW -->
    <line x1="900" y1="300" x2="1076.78" y2="476.78" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="1076.78" cy="476.78" r="30" fill="#c7ceea" stroke="#333" stroke-width="2"/>
    <text x="1076.78" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P6
    </text>
    <text x="1076.78" y="489" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      135°
    </text>
    <text x="1076.78" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b6bff">
      NEW
    </text>
    
    <!-- Player 2 at 180° (South) - MOVED OUT -->
    <line x1="900" y1="300" x2="900" y2="550" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="900" cy="550" r="30" fill="#4ecdc4" stroke="#333" stroke-width="3"/>
    <text x="900" y="548" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
      P2
    </text>
    <text x="900" y="562" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">
      180°
    </text>
    <text x="900" y="580" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4ecdc4">
      MOVED OUT
    </text>
    
    <!-- Player 7 at 225° (SW) - NEW -->
    <line x1="900" y1="300" x2="723.22" y2="476.78" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="723.22" cy="476.78" r="30" fill="#c7ceea" stroke="#333" stroke-width="2"/>
    <text x="723.22" y="475" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P7
    </text>
    <text x="723.22" y="489" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      225°
    </text>
    <text x="723.22" y="510" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b6bff">
      NEW
    </text>
    
    <!-- Player 3 at 270° (West) - MOVED OUT -->
    <line x1="900" y1="300" x2="650" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="650" cy="300" r="30" fill="#ffe66d" stroke="#333" stroke-width="3"/>
    <text x="650" y="298" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P3
    </text>
    <text x="650" y="312" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      270°
    </text>
    <text x="650" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffe66d">
      MOVED OUT
    </text>
    
    <!-- Player 8 at 315° (NW) - NEW -->
    <line x1="900" y1="300" x2="723.22" y2="123.22" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="723.22" cy="123.22" r="30" fill="#c7ceea" stroke="#333" stroke-width="2"/>
    <text x="723.22" y="121" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      P8
    </text>
    <text x="723.22" y="135" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
      315°
    </text>
    <text x="723.22" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b6bff">
      NEW
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="400" y="520" width="400" height="70" fill="#f9f9f9" stroke="#333" stroke-width="1" rx="5"/>
    <text x="600" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
      Legend
    </text>
    <circle cx="430" cy="560" r="12" fill="#ff6b6b" stroke="#333" stroke-width="2"/>
    <text x="450" y="565" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">
      Players 1-4: Move radially outward 0.75f (maintain original angles)
    </text>
    <circle cx="430" cy="580" r="12" fill="#c7ceea" stroke="#333" stroke-width="2"/>
    <text x="450" y="585" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#333">
      Players 5-8: New players join at 45° intervals between existing players
    </text>
  </g>
</svg>

